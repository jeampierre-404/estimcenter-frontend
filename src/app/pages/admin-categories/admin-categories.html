<section class="recent-activity" style="margin-top: 0;">
    
    <!-- 🔥 HEADER CON FLEXBOX EN LÍNEA 🔥 -->
    <div class="section-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px;">
        <h2 style="margin: 0; font-size: 1.5em; color: #122A51;">🏷️ Gestión de Categorías</h2>
        <button class="btn-primary-admin" routerLink="/admin/categorias/nueva" style="padding: 10px 20px; font-weight: bold;">
            <i class="fa-solid fa-plus"></i> Nueva Categoría
        </button>
    </div>

    <!-- 🔥 LA CAJA MÁGICA PARA EL SCROLL MÓVIL EN LÍNEA 🔥 -->
    <div class="table-container" style="overflow-x: auto; width: 100%; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); -webkit-overflow-scrolling: touch;">
        
        <!-- 🔥 TABLA CON ANCHO MÍNIMO 🔥 -->
        <table class="human-table" style="min-width: 700px; width: 100%; border-collapse: collapse;">
            <thead>
                <tr>
                    <th style="padding: 15px; text-align: left; border-bottom: 1px solid #eee; background-color: #f8f9fa; color: #555; font-weight: 600;">Nombre</th>
                    <th style="padding: 15px; text-align: left; border-bottom: 1px solid #eee; background-color: #f8f9fa; color: #555; font-weight: 600;">Descripción</th>
                    <th style="padding: 15px; text-align: left; border-bottom: 1px solid #eee; background-color: #f8f9fa; color: #555; font-weight: 600;">Estado</th>
                    <th style="padding: 15px; text-align: left; border-bottom: 1px solid #eee; background-color: #f8f9fa; color: #555; font-weight: 600;">Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let cat of categorias">
                    <td style="padding: 15px; border-bottom: 1px solid #eee;">
                        <strong style="color: #333;">{{ cat.nombre }}</strong>
                    </td>
                    <td style="padding: 15px; border-bottom: 1px solid #eee; color: #666;">
                        {{ cat.descripcion }}
                    </td>
                    <td style="padding: 15px; border-bottom: 1px solid #eee;">
                        <!-- El [ngClass] se encarga de pintar verde o amarillo, y el style extra le da la forma -->
                        <span class="status-badge" [ngClass]="cat.estado ? 'success' : 'pending'" style="padding: 4px 8px; border-radius: 4px; font-size: 0.85em;">
                            {{ cat.estado ? 'Activo' : 'Inactivo' }}
                        </span>
                    </td>
                    <td style="padding: 15px; border-bottom: 1px solid #eee;">
                        <div style="display: flex; gap: 10px;">
                            <button class="btn-icon" [routerLink]="['/admin/categorias/editar', cat.idCategoria]" 
                                    style="color: #4a69bd; background: none; border: none; cursor: pointer; font-size: 1.2em;" title="Editar">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                            <button class="btn-icon" (click)="eliminar(cat.idCategoria)" 
                                    style="color: #ff4757; background: none; border: none; cursor: pointer; font-size: 1.2em;" title="Eliminar">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </td>
                </tr>
                <tr *ngIf="categorias.length === 0">
                    <td colspan="4" style="text-align: center; padding: 20px; color: #999;">
                        No hay categorías registradas.
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</section>
