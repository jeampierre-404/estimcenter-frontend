<div class="login-wrapper">
    <div class="overlay"></div>
    <div class="dual-layout">
        
        <div class="front">
            <div style="width: 80px; height: 80px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px auto; box-shadow: 0 5px 15px rgba(0,0,0,0.2);">
                <img src="assets/imagenes/logo_empresa.png" style="width: 55px;">
            </div>
            
            <h2 style="font-size: 1.6em; margin-bottom: 2px; color: #FF8C00; font-weight: bold;">ACCESO RÁPIDO</h2>
            <p style="font-size: 12px; color: #666; margin-top:0px; margin-bottom: 20px;">Ingresa tus datos para continuar</p>
            
            <form style="width: 90%;">
                <div class="form-group" style="position: relative; margin-bottom: 15px;">
                    <span class="glyphicon glyphicon-user" style="position: absolute; left: 15px; top: 12px; color: #FF8C00;"></span>
                    <input type="text" class="form-control" placeholder="Tu Nombre Completo" name="loginNombre" [(ngModel)]="loginNombre" maxlength="50" (input)="soloLetras($event)" style="padding-left: 40px; border-radius: 25px; height: 40px;">
                </div>
                
                <div class="form-group" style="position: relative; margin-bottom: 20px;">
                    <span class="glyphicon glyphicon-phone" style="position: absolute; left: 15px; top: 12px; color: #FF8C00;"></span>
                    <input type="tel" class="form-control" placeholder="Tu WhatsApp (Celular)" name="loginCelular" [(ngModel)]="loginCelular" maxlength="9" (input)="soloNumeros($event)" style="padding-left: 40px; border-radius: 25px; height: 40px;">
                </div>

                <button type="button" class="btn btn-action" style="background: #122A51; color: white; width: 100%; border-radius: 25px; height: 45px; font-weight: bold; margin-top: 5px;" (click)="ingresarMagico()">
                    INGRESAR AHORA
                </button>
            </form>
            
            <a routerLink="/cotizar" style="display: block; margin-top: 20px; font-size: 12px; color: #aaa; text-decoration: none;">
                <span class="glyphicon glyphicon-arrow-left"></span> Volver a Cotizar
            </a>
        </div>

    </div>
</div>
